<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Live Monitor • Podgląd Sceny</title>
    <link rel="stylesheet" href="/static/tablet.css?v=oled5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
</head>

<body class="stage-oled">
    <div id="urgent-flash-overlay" class="urgent-flash-overlay" aria-hidden="true"></div>
    <!-- Tablet OLED Header -->
    <header class="tablet-nav">
        <div class="nav-brand">
            <div class="pulse-indicator" id="ws-indicator"></div>
            <div>
                <h1>AI LIVE MONITOR</h1>
                <span class="host-info" id="ws-status">ŁĄCZENIE...</span>
            </div>
        </div>

        <div class="nav-stats">
            <div class="queue-filters">
                <button class="filter-btn active" data-view="stage">Tory na żywo</button>
                <button class="filter-btn" data-view="foh">Dla realizatora</button>
                <button class="filter-btn" data-view="history">Historia</button>
            </div>
            <div class="clock" id="tablet-clock">--:--:--</div>
        </div>
    </header>

    <!-- Main Pure Read-Only Live Speech Monitor -->
    <main class="tablet-main">
        <!-- View 1: Live Stage Channels (default) -->
        <section id="tablet-stage-view" class="tablet-stage-grid"></section>

        <!-- View 2/3: Chronological Speech Stream / Engineer Highlights -->
        <section id="tablet-feed-view" class="action-cards-container hidden"></section>
    </main>

    <script src="/static/tablet.js?v=oled5"></script>
</body>

</html>
